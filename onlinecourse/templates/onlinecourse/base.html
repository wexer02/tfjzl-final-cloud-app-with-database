{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Course{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Online Course</a>
        <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
                <span class="text-white mr-3">{{ user.get_full_name|default:user.username }}</span>
                {% if user.is_staff %}<a class="btn btn-outline-light btn-sm mr-3" href="{% url 'admin:index' %}">Admin</a>{% endif %}
                <form method="post" action="{% url 'onlinecourse:logout' %}">
                    {% csrf_token %}<button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'onlinecourse:login' %}">Log in</a>
            {% endif %}
        </div>
    </nav>
    <main class="container pb-5">{% block content %}{% endblock %}</main>
</body>
</html>
